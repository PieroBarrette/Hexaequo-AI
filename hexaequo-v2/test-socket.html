<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Socket.IO - Hexaequo</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #00ff00; }
        .log {
            background: #000;
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .log p {
            margin: 5px 0;
            font-size: 14px;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .info { color: #ffff00; }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            border-radius: 3px;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <h1>🧪 Test de Connexion Socket.IO</h1>
    
    <div>
        <button onclick="testConnection()">🔄 Tester la connexion</button>
        <button onclick="clearLog()">🗑️ Effacer les logs</button>
    </div>

    <div class="log" id="log"></div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        const SERVER_URL = 'http://localhost:3001';
        let socket = null;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function testConnection() {
            log('🔄 Tentative de connexion à ' + SERVER_URL, 'info');
            
            if (socket && socket.connected) {
                log('⚠️ Déconnexion du socket existant...', 'info');
                socket.disconnect();
            }

            socket = io(SERVER_URL, {
                transports: ['polling', 'websocket'],
                upgrade: true,
                timeout: 20000,
                reconnection: false
            });

            socket.on('connect', () => {
                log('✅ CONNEXION RÉUSSIE ! Socket ID: ' + socket.id, 'success');
                log('✅ Transport utilisé: ' + socket.io.engine.transport.name, 'success');
                
                // Test d'événement
                socket.emit('test-event', { message: 'Hello from client' });
            });

            socket.on('connect_error', (err) => {
                log('❌ ERREUR DE CONNEXION: ' + err.message, 'error');
                log('❌ Détails: ' + JSON.stringify(err), 'error');
            });

            socket.on('disconnect', (reason) => {
                log('🔌 Déconnecté: ' + reason, 'info');
            });

            socket.on('error', (err) => {
                log('❌ Erreur socket: ' + err, 'error');
            });

            // Timeout après 10 secondes
            setTimeout(() => {
                if (!socket.connected) {
                    log('⏱️ TIMEOUT: Impossible de se connecter après 10 secondes', 'error');
                }
            }, 10000);
        }

        // Test automatique au chargement
        window.addEventListener('load', () => {
            log('📄 Page chargée', 'info');
            log('🎯 URL du serveur: ' + SERVER_URL, 'info');
            log('', 'info');
            testConnection();
        });
    </script>
</body>
</html>
