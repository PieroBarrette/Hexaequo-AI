<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="HEXAEQUO - Strategic hexagonal board game. Play against AI or with a friend.">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HEXAEQUO">
    <title>Hexaequo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Favicons with dark/light mode support -->
    <link rel="icon" href="icons/icon-192x192.png"
        media="(prefers-color-scheme: no-preference), (prefers-color-scheme: light)">
    <link rel="icon" href="icons/icon-192x192-dark.png" media="(prefers-color-scheme: dark)">

    <!-- Apple touch icons with dark/light mode support -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png"
        media="(prefers-color-scheme: no-preference), (prefers-color-scheme: light)">
    <link rel="apple-touch-icon" href="icons/icon-192x192-dark.png" media="(prefers-color-scheme: dark)">
</head>

<body>

    <h1 style="display: none;">Hexaequo</h1> <!-- Hidden for accessibility -->
    <button id="toggleCoordsBtn" style="display: none;">Coordinates</button>
    <button id="toggleColorSchemeBtn" style="display: none;">Color</button>
    <button id="toggleGridBtn" style="display: none;">Grid</button>

    <div id="gameContainer">
        <div id="undoRedoToolbar">
            <button id="undoBtn" class="undo-redo-btn" title="Undo">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 8c0-1.66-1.34-3-3-3H5l2-2m0 8l-2-2"/>
                </svg>
            </button>
            <div id="playerIndicator" class="player-indicator player-black">Player: Black</div>
            <button id="redoBtn" class="undo-redo-btn" title="Redo">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 8c0-1.66 1.34-3 3-3h5l-2-2m0 8l2-2"/>
                </svg>
            </button>
        </div>
        <!-- <div id="uiLayer">
            <div id="playerStatus"></div>
        </div> -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <canvas id="inventoryCanvas" width="800" height="600"></canvas>
    </div>

    <!-- Hamburger Menu Button -->
    <div id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Menu Overlay -->
    <div id="menuOverlay">
        <div class="menu-content">
            <div class="menu-title">Settings</div>

            <div class="menu-item">
                <label>Theme</label>
                <div class="toggle-container" style="display: flex; align-items: center; gap: 10px;">
                    <span class="toggle-label" style="font-size: 0.9em; color: #ccc;">Dark</span>
                    <label class="switch">
                        <input type="checkbox" id="themeToggle" checked>
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label" style="font-size: 0.9em; color: #ccc;">Light</span>
                </div>
            </div>

            <div class="menu-item">
                <label>Sound</label>
                <label class="switch">
                    <input type="checkbox" id="soundToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="menu-item">
                <label>Show Valid Moves</label>
                <label class="switch">
                    <input type="checkbox" id="validMovesToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="menu-item">
                <label>Show Previous Move</label>
                <label class="switch">
                    <input type="checkbox" id="previousMoveToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="menu-item">
                <label>Game Mode</label>
                <select id="gameModeSelect">
                    <option value="2player">2 Players</option>
                    <option value="ai">vs AI</option>
                </select>
            </div>

            <div class="menu-item" id="difficultyContainer">
                <label>Difficulty</label>
                <select id="difficultySelect">
                    <option value="1">Level 1 (Easy)</option>
                    <option value="2">Level 2 (Normal)</option>
                    <option value="3" selected>Level 3 (Hard)</option>
                    <option value="4">Level 4 (Expert)</option>
                </select>
            </div>

            <button id="rulesBtn" class="menu-btn">📖 View Rules</button>
            <button id="newGameBtn" class="menu-btn primary">New Game</button>
            <button id="closeMenuBtn" class="menu-btn">Close</button>
        </div>
    </div>

    <!-- Rules Modal -->
    <div id="rulesOverlay" class="rules-overlay">
        <div class="rules-modal">
            <div class="rules-header">
                <h2>Game Rules</h2>
                <button id="closeRulesBtn" class="close-rules-btn" title="Close">✕</button>
            </div>
            <div id="pdfContainer" class="pdf-container">
                <div class="pdf-viewer">
                    <canvas id="pdfCanvas"></canvas>
                </div>
            </div>
            <div class="rules-footer">
                <button id="prevPageBtn" class="page-nav-btn" title="Previous Page">← Prev</button>
                <span id="pageIndicator" class="page-indicator">Page 1 of 10</span>
                <button id="nextPageBtn" class="page-nav-btn" title="Next Page">Next →</button>
            </div>
        </div>
    </div>

    <script src="ai.js"></script>
    <script src="game.js"></script>
    <script>
        // Set up PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;

        // PDF Viewer Setup
        async function initializePdfViewer() {
            try {
                pdfDoc = await pdfjsLib.getDocument('./rules.pdf').promise;
                totalPages = pdfDoc.numPages;
                renderPage(currentPage);
                updatePageIndicator();
            } catch (error) {
                console.error('Error loading PDF:', error);
                document.getElementById('pdfContainer').innerHTML = '<p style="color: red; padding: 20px;">Error loading rules PDF</p>';
            }
        }

        async function renderPage(pageNum) {
            if (!pdfDoc) return;
            
            try {
                const page = await pdfDoc.getPage(pageNum);
                const canvas = document.getElementById('pdfCanvas');
                const ctx = canvas.getContext('2d');
                
                // Set viewport with proper scaling
                const viewport = page.getViewport({ scale: window.devicePixelRatio });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                // Render page to canvas
                await page.render({
                    canvasContext: ctx,
                    viewport: viewport
                }).promise;
            } catch (error) {
                console.error('Error rendering page:', error);
            }
        }

        function updatePageIndicator() {
            document.getElementById('pageIndicator').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPageBtn').disabled = currentPage <= 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
        }

        // Event Listeners for PDF Navigation
        document.getElementById('prevPageBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
                updatePageIndicator();
            }
        });

        document.getElementById('nextPageBtn').addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
                updatePageIndicator();
            }
        });
    </script>
    <script>
        // Menu Logic
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const menuOverlay = document.getElementById('menuOverlay');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const rulesBtn = document.getElementById('rulesBtn');
        const rulesOverlay = document.getElementById('rulesOverlay');
        const closeRulesBtn = document.getElementById('closeRulesBtn');
        const soundToggle = document.getElementById('soundToggle');
        const difficultySelect = document.getElementById('difficultySelect');
        const gameModeSelect = document.getElementById('gameModeSelect');
        const newGameBtn = document.getElementById('newGameBtn');
        const themeToggle = document.getElementById('themeToggle');
        const validMovesToggle = document.getElementById('validMovesToggle');
        const previousMoveToggle = document.getElementById('previousMoveToggle');
        const difficultyContainer = document.getElementById('difficultyContainer');

        function toggleMenu() {
            hamburgerBtn.classList.toggle('open');
            menuOverlay.classList.toggle('open');
        }

        hamburgerBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', toggleMenu);

        // Rules Menu
        function openRules() {
            rulesOverlay.classList.add('open');
            if (!pdfDoc) {
                initializePdfViewer();
            } else {
                renderPage(currentPage);
            }
        }

        function closeRules() {
            rulesOverlay.classList.remove('open');
        }

        rulesBtn.addEventListener('click', openRules);
        closeRulesBtn.addEventListener('click', closeRules);
        rulesOverlay.addEventListener('click', (e) => {
            if (e.target === rulesOverlay) {
                closeRules();
            }
        });

        // Close menu when clicking outside
        menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) {
                toggleMenu();
            }
        });

        // Settings Management
        const defaultSettings = {
            sound: true,
            difficulty: 2,
            gameMode: 'ai', // '2player' or 'ai'
            theme: 'light', // 'light' or 'dark'
            showValidMoves: false, // Show valid moves indicator
            showPreviousMove: true
        };

        function saveSettings() {
            const settings = {
                sound: soundToggle.checked,
                difficulty: parseInt(difficultySelect.value),
                gameMode: gameModeSelect.value,
                theme: themeToggle.checked ? 'light' : 'dark',
                showValidMoves: validMovesToggle.checked,
                showPreviousMove: previousMoveToggle.checked
            };
            localStorage.setItem('hexaequoSettings', JSON.stringify(settings));
        }

        function loadSettings() {
            const saved = localStorage.getItem('hexaequoSettings');
            let settings = defaultSettings;

            if (saved) {
                try {
                    settings = { ...defaultSettings, ...JSON.parse(saved) };
                } catch (e) {
                    console.error('Error parsing settings:', e);
                }
            } else {
                // First time load: respect system preference for theme
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                settings.theme = systemPrefersDark ? 'dark' : 'light';
            }

            // Apply settings to UI
            soundToggle.checked = settings.sound;
            difficultySelect.value = settings.difficulty;
            gameModeSelect.value = settings.gameMode;
            themeToggle.checked = settings.theme === 'light';
            validMovesToggle.checked = settings.showValidMoves;
            previousMoveToggle.checked = settings.showPreviousMove;

            // Apply settings to Game Logic
            if (window.setSoundEnabled) window.setSoundEnabled(settings.sound);
            if (window.setAiDifficulty) window.setAiDifficulty(settings.difficulty);
            if (window.toggleGameMode) window.toggleGameMode(settings.gameMode === 'ai');
            if (window.setShowValidMoves) window.setShowValidMoves(settings.showValidMoves);
            if (window.setShowPreviousMove) window.setShowPreviousMove(settings.showPreviousMove);

            // Apply Theme
            applyTheme(settings.theme === 'light');

            // Set initial visibility of difficulty container
            if (difficultyContainer) {
                difficultyContainer.style.display = settings.gameMode === 'ai' ? 'flex' : 'none';
            }
        }

        // Update event listeners to save settings
        soundToggle.addEventListener('change', (e) => {
            window.setSoundEnabled(e.target.checked);
            saveSettings();
        });

        validMovesToggle.addEventListener('change', (e) => {
            window.setShowValidMoves(e.target.checked);
            saveSettings();
        });

        previousMoveToggle.addEventListener('change', (e) => {
            window.setShowPreviousMove(e.target.checked);
            saveSettings();
        });

        difficultySelect.addEventListener('change', (e) => {
            const level = parseInt(e.target.value);
            window.setAiDifficulty(level);
            saveSettings();
        });

        gameModeSelect.addEventListener('change', (e) => {
            const mode = e.target.value;
            const isAi = mode === 'ai';
            window.toggleGameMode(isAi);
            if (difficultyContainer) {
                difficultyContainer.style.display = isAi ? 'flex' : 'none';
            }
            saveSettings();
        });

        // Theme Toggle
        function applyTheme(isLight) {
            document.body.setAttribute('data-theme', isLight ? 'light' : 'dark');
            // Update toggle state
            themeToggle.checked = isLight;

            // Update meta theme color
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) {
                themeColor.content = isLight ? '#ffffff' : '#000000';
            }

            // Update icons
            const prefersDark = !isLight;
            const favicon = document.querySelector('link[rel="icon"]');
            if (favicon) {
                favicon.href = prefersDark ? 'icons/icon-192x192-dark.png' : 'icons/icon-192x192.png';
            }
            const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleIcon) {
                appleIcon.href = prefersDark ? 'icons/icon-192x192-dark.png' : 'icons/icon-192x192.png';
            }

            // Update game theme if the function exists
            if (window.setGameTheme) {
                window.setGameTheme(isLight ? 'light' : 'dark');
            }
        }

        themeToggle.addEventListener('change', (e) => {
            applyTheme(e.target.checked);
            saveSettings();
        });

        // New Game Button
        newGameBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to start a new game? Current progress will be lost.')) {
                window.resetGame();
                toggleMenu();
            }
        });

        // Initialize settings on load
        window.addEventListener('load', () => {
            setTimeout(loadSettings, 0);
            // Pre-load PDF on initial load for better UX
            setTimeout(initializePdfViewer, 1000);
        });

        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>
</body>

</html>
