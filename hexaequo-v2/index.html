<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="HEXAEQUO - Strategic hexagonal board game. Play against AI or with a friend.">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HEXAEQUO">
    <title>HEXAEQUO</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">

    <!-- Favicons with dark/light mode support -->
    <link rel="icon" href="icons/icon-192x192.png"
        media="(prefers-color-scheme: no-preference), (prefers-color-scheme: light)">
    <link rel="icon" href="icons/icon-192x192-dark.png" media="(prefers-color-scheme: dark)">

    <!-- Apple touch icons with dark/light mode support -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png"
        media="(prefers-color-scheme: no-preference), (prefers-color-scheme: light)">
    <link rel="apple-touch-icon" href="icons/icon-192x192-dark.png" media="(prefers-color-scheme: dark)">
</head>

<body>

    <h1 style="display: none;">HEXAEQUO</h1> <!-- Hidden for accessibility -->
    <button id="toggleCoordsBtn" style="display: none;">Coordinates</button>
    <button id="toggleColorSchemeBtn" style="display: none;">Color</button>
    <button id="toggleGridBtn" style="display: none;">Grid</button>

    <div id="gameContainer">
        <div id="uiLayer">
            <div id="playerStatus"></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <canvas id="inventoryCanvas" width="800" height="600"></canvas>
    </div>

    <!-- Hamburger Menu Button -->
    <div id="hamburgerBtn">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Menu Overlay -->
    <div id="menuOverlay">
        <div class="menu-content">
            <div class="menu-title">Settings</div>

            <div class="menu-item">
                <label>Sound</label>
                <label class="switch">
                    <input type="checkbox" id="soundToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="menu-item">
                <label>Difficulty</label>
                <select id="difficultySelect">
                    <option value="1">Level 1 (Easy)</option>
                    <option value="2">Level 2 (Normal)</option>
                    <option value="3" selected>Level 3 (Hard)</option>
                    <option value="4">Level 4 (Expert)</option>
                </select>
            </div>

            <div class="menu-item">
                <label>Game Mode</label>
                <select id="gameModeSelect">
                    <option value="2player">2 Players</option>
                    <option value="ai">vs AI</option>
                </select>
            </div>

            <div class="menu-item">
                <label>Theme</label>
                <div class="toggle-container" style="display: flex; align-items: center; gap: 10px;">
                    <span class="toggle-label" style="font-size: 0.9em; color: #ccc;">Dark</span>
                    <label class="switch">
                        <input type="checkbox" id="themeToggle" checked>
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label" style="font-size: 0.9em; color: #ccc;">Light</span>
                </div>
            </div>

            <button id="newGameBtn" class="menu-btn primary">New Game</button>
            <button id="closeMenuBtn" class="menu-btn">Close</button>
        </div>
    </div>

    <script src="ai.js"></script>
    <script src="game.js"></script>
    <script>
        // Menu Logic
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const menuOverlay = document.getElementById('menuOverlay');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const soundToggle = document.getElementById('soundToggle');
        const difficultySelect = document.getElementById('difficultySelect');
        const gameModeSelect = document.getElementById('gameModeSelect');
        const newGameBtn = document.getElementById('newGameBtn');
        const themeToggle = document.getElementById('themeToggle');

        function toggleMenu() {
            hamburgerBtn.classList.toggle('open');
            menuOverlay.classList.toggle('open');
        }

        hamburgerBtn.addEventListener('click', toggleMenu);
        closeMenuBtn.addEventListener('click', toggleMenu);

        // Close menu when clicking outside
        menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) {
                toggleMenu();
            }
        });

        // Sound Toggle
        soundToggle.addEventListener('change', (e) => {
            window.setSoundEnabled(e.target.checked);
        });

        // Difficulty Select
        difficultySelect.addEventListener('change', (e) => {
            const level = parseInt(e.target.value);
            window.setAiDifficulty(level);
        });

        // Game Mode Select
        gameModeSelect.addEventListener('change', (e) => {
            const mode = e.target.value;
            const isAi = mode === 'ai';
            window.toggleGameMode(isAi);
        });

        // Theme Toggle
        // Checked = Light, Unchecked = Dark (default is checked in HTML, so default Light?)
        // Wait, user asked for Dark Mode. Usually apps start in system preference or light.
        // Let's make Checked = Light, Unchecked = Dark.
        // Or better: Checked = Dark?
        // The label says "Dark [Switch] Light". So Left is Dark, Right is Light.
        // If switch is OFF (left), it's Dark. If ON (right), it's Light.
        // HTML has `checked`.

        function applyTheme(isLight) {
            document.body.setAttribute('data-theme', isLight ? 'light' : 'dark');
            // Update toggle state
            themeToggle.checked = isLight;

            // Update meta theme color
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) {
                themeColor.content = isLight ? '#ffffff' : '#000000';
            }

            // Update icons
            const prefersDark = !isLight;
            const favicon = document.querySelector('link[rel="icon"]');
            if (favicon) {
                favicon.href = prefersDark ? 'icons/icon-192x192-dark.png' : 'icons/icon-192x192.png';
            }
            const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleIcon) {
                appleIcon.href = prefersDark ? 'icons/icon-192x192-dark.png' : 'icons/icon-192x192.png';
            }
        }

        themeToggle.addEventListener('change', (e) => {
            applyTheme(e.target.checked);
        });

        // Initialize theme based on system preference
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(!systemPrefersDark); // If dark, isLight=false

        // New Game Button
        newGameBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to start a new game? Current progress will be lost.')) {
                window.resetGame();
                toggleMenu();
            }
        });

        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>
</body>

</html>
