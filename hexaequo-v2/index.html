<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="HEXAEQUO - Strategic hexagonal board game. Play against AI or with a friend.">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HEXAEQUO">
    <title>HEXAEQUO</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicons with dark/light mode support -->
    <link rel="icon" href="icons/icon-192x192.png" media="(prefers-color-scheme: no-preference), (prefers-color-scheme: light)">
    <link rel="icon" href="icons/icon-192x192-dark.png" media="(prefers-color-scheme: dark)">
    
    <!-- Apple touch icons with dark/light mode support -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" media="(prefers-color-scheme: no-preference), (prefers-color-scheme: light)">
    <link rel="apple-touch-icon" href="icons/icon-192x192-dark.png" media="(prefers-color-scheme: dark)">
</head>

<body>

    <h1 style="display: none;">HEXAEQUO</h1> <!-- Hidden for accessibility -->
    <button id="toggleCoordsBtn" style="display: none;">Coordinates</button>
    <button id="toggleColorSchemeBtn" style="display: none;">Color</button>
    <button id="toggleGridBtn" style="display: none;">Grid</button>
    <div id="gameContainer">
        <div id="uiLayer">
            <button id="toggleModeBtn">Switch to AI Mode</button>
            <div id="playerStatus"></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <canvas id="inventoryCanvas" width="800" height="600"></canvas>
    </div>
    <script src="ai.js"></script>
    <script src="game.js"></script>
    <script>
        document.getElementById('toggleModeBtn').addEventListener('click', () => {
            const newMode = !window.isAiMode;
            window.isAiMode = newMode;
            window.toggleGameMode(newMode);
            document.getElementById('toggleModeBtn').innerText = newMode ? 'Switch to 2 Player Mode' : 'Switch to AI Mode';
        });

        // Update icons based on color scheme preference
        function updateIconsForTheme() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            // Update favicon
            const favicon = document.querySelector('link[rel="icon"]');
            if (favicon) {
                favicon.href = prefersDark ? 'icons/icon-192x192-dark.png' : 'icons/icon-192x192.png';
            }
            
            // Update Apple touch icon
            const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleIcon) {
                appleIcon.href = prefersDark ? 'icons/icon-192x192-dark.png' : 'icons/icon-192x192.png';
            }
            
            // Update theme-color meta tag
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) {
                themeColor.content = prefersDark ? '#000000' : '#ffffff';
            }
        }
        
        // Listen for theme changes
        if (window.matchMedia) {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            mediaQuery.addEventListener('change', updateIconsForTheme);
            updateIconsForTheme(); // Initial update
        }

        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed:', err);
                    });
            });
        }
    </script>
</body>

</html>
