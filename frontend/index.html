<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Hexaequo Frontend Prototype</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
	<style>
		:root {
			color-scheme: dark;
			font-family: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background-color: #0f172a;
			color: #e2e8f0;
		}

		body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		main {
			width: 100%;
			max-width: 1200px;
			padding: 24px;
			box-sizing: border-box;
			display: grid;
			gap: 24px;
		}

		.canvas-shell {
			background: #111827;
			border: 1px solid rgba(148, 163, 184, 0.3);
			border-radius: 16px;
			padding: 16px;
			box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
		}

		.hud-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 16px;
		}

		.hud-card {
			background: #111827;
			border: 1px solid rgba(148, 163, 184, 0.25);
			border-radius: 14px;
			padding: 16px;
			box-shadow: 0 12px 30px rgba(15, 23, 42, 0.4);
			min-height: 120px;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.timer-card {
			gap: 16px;
		}

		.timer-card .timer-row {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.timer-card .timer-row > div {
			flex: 1;
		}

		.inventory-card {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 12px;
		}

		.hud-label {
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: #94a3b8;
		}

		.hud-value {
			font-size: 1.4rem;
			color: #f8fafc;
		}

		.hud-list {
			list-style: none;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 4px;
			font-size: 0.9rem;
		}

		#modernGameCanvas {
			width: 100%;
			height: 540px;
			display: block;
			background: radial-gradient(circle at top, rgba(255, 255, 255, 0.05), rgba(15, 23, 42, 0.95));
			border-radius: 12px;
		}

		canvas {
			border: none;
		}

		.dev-panel {
			display: flex;
			gap: 12px;
		}

		.status-panel {
			background: #111827;
			border: 1px solid rgba(148, 163, 184, 0.3);
			border-radius: 16px;
			padding: 16px;
			display: flex;
			flex-direction: column;
			gap: 12px;
			box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
		}

		.status-row {
			display: flex;
			justify-content: space-between;
			font-size: 0.95rem;
			color: #cbd5f5;
		}

		.status-actions {
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
		}

		.status-actions input {
			flex: 1;
			min-width: 140px;
			padding: 10px 14px;
			border-radius: 8px;
			border: 1px solid rgba(148, 163, 184, 0.4);
			background: #0f172a;
			color: #e2e8f0;
			font-size: 0.95rem;
		}

		.status-actions input:focus {
			outline: none;
			border-color: #10b981;
			box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
		}

		.status-error {
			margin: 0;
			font-size: 0.85rem;
			color: #f87171;
		}

		button {
			cursor: pointer;
			border: none;
			border-radius: 8px;
			padding: 10px 16px;
			font-size: 0.95rem;
			font-weight: 600;
			background: #10b981;
			color: #0f172a;
			transition: transform 0.1s ease, box-shadow 0.1s ease;
		}

		button:hover {
			transform: translateY(-1px);
			box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
		}
	</style>
</head>

<body>
	<main>
		<section class="canvas-shell">
			<canvas id="modernGameCanvas" width="1080" height="540"></canvas>
		</section>
		<section class="dev-panel">
			<button id="devAddTile">Add Tile</button>
			<button id="devAddDisc">Add Piece</button>
		</section>
		<section class="hud-grid">
			<div class="hud-card" data-turn-indicator>
				<span class="hud-label">Active Player</span>
				<strong class="hud-value">--</strong>
			</div>
			<div class="hud-card timer-card">
				<div class="timer-row">
					<div data-timer-black>
						<span class="hud-label">Black Timer</span>
						<strong class="hud-value">--:--</strong>
					</div>
					<div data-timer-white>
						<span class="hud-label">White Timer</span>
						<strong class="hud-value">--:--</strong>
					</div>
				</div>
			</div>
			<div class="hud-card inventory-card">
				<div data-inventory-black>
					<span class="hud-label">Black</span>
					<ul class="hud-list">
						<li>Tiles: <strong>0</strong></li>
						<li>Discs: <strong>0</strong></li>
						<li>Rings: <strong>0</strong></li>
						<li>Captured discs: <strong>0</strong></li>
						<li>Captured rings: <strong>0</strong></li>
					</ul>
				</div>
				<div data-inventory-white>
					<span class="hud-label">White</span>
					<ul class="hud-list">
						<li>Tiles: <strong>0</strong></li>
						<li>Discs: <strong>0</strong></li>
						<li>Rings: <strong>0</strong></li>
						<li>Captured discs: <strong>0</strong></li>
						<li>Captured rings: <strong>0</strong></li>
					</ul>
				</div>
			</div>
		</section>
		<section class="status-panel">
			<div class="status-row">
				<span>Server:</span>
				<strong data-connection-status>disconnected</strong>
			</div>
			<div class="status-row">
				<span>Room:</span>
				<strong data-room-code>----</strong>
			</div>
			<div class="status-actions">
				<button id="connectServerBtn">Connect</button>
				<button id="createRoomDevBtn">Create Room</button>
				<input id="roomCodeInput" placeholder="Room code" maxlength="4" autocapitalize="characters" />
				<button id="joinRoomDevBtn">Join Room</button>
				<button id="leaveRoomDevBtn">Leave Room</button>
				<button id="sendStateBtn">Send State</button>
			</div>
			<p class="status-error" data-error-msg></p>
		</section>
	</main>

	<script type="module" src="./js/app.js"></script>
</body>

</html>
