<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    <title>HEXAEQUO - Strategic Hex Game</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Strategic hexagonal board game with online multiplayer, AI opponents, and competitive ELO ranking system.">
    <meta name="theme-color" content="#b4bbc9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HEXAEQUO">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/frontend/assets/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/frontend/assets/icons/icon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/icons/icon-180x180.png">
    
    <style>
        body {
            background: #0d1014;
            color: #f5f7fa;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        a {
            color: #b4bbc9;
            text-decoration: none;
            font-size: 1.2em;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HEXAEQUO</h1>
        <p>Redirecting to game...</p>
        <p>If you are not redirected automatically, <a href="frontend/index.html">click here</a>.</p>
    </div>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('[PWA] Service Worker registered:', registration);
                    })
                    .catch(error => {
                        console.log('[PWA] Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
