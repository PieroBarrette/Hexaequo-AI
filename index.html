<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexaequo</title>
<!--
  In production the backend serves web/ directly at "/", so this file is never
  reached. It only matters when something serves the repository root, in which
  case it forwards to the app, preserving the query string and hash so invite
  links survive the hop.
-->
<script>
  window.location.replace('web/index.html' + window.location.search + window.location.hash);
</script>
<style>
  body { background: #0e1015; color: #e6e9ef; font-family: system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  a { color: #d8a13a; }
</style>
</head>
<body>
<div style="text-align:center">
  <h1 style="font-weight:300;letter-spacing:.27em">HEXAEQUO</h1>
  <p>If you are not redirected, <a href="web/index.html">open the app</a>.</p>
  <noscript><meta http-equiv="refresh" content="0; url=web/index.html"></noscript>
</div>
</body>
</html>
